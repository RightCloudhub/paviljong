<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="输入文字，实时调整字号、字重与字距的交互排版实验。">
  <meta name="theme-color" content="#e9eff1">
  <title>Type Lab — 交互排版实验</title>
  <script>if(new URLSearchParams(location.search).get('preview')==='1')document.documentElement.classList.add('preview');if(window.self!==window.top)document.documentElement.classList.add('embedded');</script>
  <style>
    .embedded .back { display: none; }
    :root{color-scheme:light;--paper:#e9eff1;--ink:#304d5c;--muted:#607987;--line:#cad7dd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,a{font:inherit}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px}button,a,input,select{outline-offset:5px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink)}button{cursor:pointer}.page{max-width:1440px;margin:auto;padding:0 64px}header{height:96px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:22px;letter-spacing:-.8px;font-weight:600}.logo span{font-family:Georgia,serif;font-style:italic;font-weight:400}.back{display:flex;align-items:center;min-height:44px;font-size:12px}.heading{display:flex;justify-content:space-between;align-items:flex-end;padding:46px 0 30px;gap:30px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 0 16px}h1{font-size:40px;letter-spacing:-2px;font-weight:400;margin:0}.heading>p{font-size:13px;line-height:1.8;color:var(--muted);margin:0;max-width:215px}.lab{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:420px;background:#f2f6f7}.specimen{min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:26px 34px;background:#dce8ed;overflow:hidden}.specimen-top{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:1.5px}.type-display{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:120px;font-weight:600;letter-spacing:-4px;line-height:1.08;overflow-wrap:anywhere;white-space:pre-wrap;margin:35px 0;max-width:100%;min-width:0;transition:font-size .15s,font-weight .15s,letter-spacing .15s}.type-display:empty:before{content:"Aa";color:#7d97a5}.specimen-bottom{font-family:Consolas,monospace;font-size:11px;color:var(--muted)}.controls{border-left:1px solid var(--line);padding:28px 24px;display:flex;flex-direction:column;gap:25px}.control{display:flex;flex-direction:column;gap:12px}.label-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}.label-row output{font-family:Consolas,monospace;font-size:11px;color:var(--muted)}input[type="text"],select{width:100%;border:1px solid var(--line);border-radius:6px;height:43px;padding:0 12px;background:#fff;color:var(--ink);font-size:13px}input[type="range"]{accent-color:#477389;width:100%;margin:0;height:22px;cursor:pointer}.reset{height:43px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:transparent;margin-top:auto;font-size:12px;transition:background .2s,transform .2s}.reset:hover{background:#e0eaee;transform:translateY(-2px)}.reset:active{transform:translateY(1px)}.status{font-size:12px;color:var(--muted);min-height:22px;line-height:1.7;margin:22px 0 0}footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:45px;padding:26px 0 35px;font-size:11px;color:var(--muted)}
    @media(max-width:800px){.page{padding:0 24px}header{height:76px}.heading{padding:35px 0 26px;display:block}h1{font-size:34px;letter-spacing:-1.5px}.heading>p{font-size:13px;max-width:none;margin-top:18px}.lab{grid-template-columns:1fr;border-radius:10px}.specimen{min-height:330px;padding:22px 20px}.type-display{font-size:78px;letter-spacing:-3px;margin:32px 0}.specimen-top{font-size:9px;letter-spacing:1px}.controls{border-left:0;border-top:1px solid var(--line);padding:24px 20px;gap:26px}.reset{margin-top:2px}input[type="text"],select{font-size:16px;height:46px}.label-row{font-size:13px}input[type="range"]{height:30px}footer{gap:20px;line-height:1.7;margin-top:30px}.specimen-bottom{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
    .preview .back,.preview footer{display:none}.preview header{height:72px}.preview .heading{padding:34px 0 28px}.preview .lab{min-height:440px}.preview .type-display{font-size:108px}.preview .controls{padding:22px;gap:14px}.preview .control{gap:8px}.preview input[type="text"],.preview select,.preview .reset{height:36px;min-height:36px}
  </style>
</head>
<body>
  <div class="page">
    <header><a class="logo" href="../../index.html" aria-label="Type Lab，返回作品集">type <span>lab.</span></a><a class="back" href="../../index.html">返回作品集 ↗</a></header>
    <main>
      <section class="heading" aria-labelledby="title"><div><p class="eyebrow">LET THE LETTERS DO THE TALKING</p><h1 id="title">文字的另一种样子。</h1></div><p>改一句话，调整几个滑块。<br>看看排版会怎样变化。</p></section>
      <div class="lab"><section class="specimen" aria-label="实时排版预览"><div class="specimen-top"><span>LIVE TYPE SPECIMEN</span><span>Aa / 01</span></div><div class="type-display" id="display">Make type<br>move.</div><div class="specimen-bottom" id="css-info">font-size: 120px; font-weight: 600;</div></section><form class="controls" id="controls"><div class="control"><label class="label-row" for="text">预览文字</label><input id="text" type="text" value="Make type / move." maxlength="80" autocomplete="off"></div><div class="control"><label class="label-row" for="size">字号 <output id="size-output" for="size">120 px</output></label><input id="size" type="range" min="24" max="160" value="120" step="1"></div><div class="control"><label class="label-row" for="weight">字重 <output id="weight-output" for="weight">600</output></label><input id="weight" type="range" min="100" max="900" value="600" step="100"></div><div class="control"><label class="label-row" for="spacing">字距 <output id="spacing-output" for="spacing">−4 px</output></label><input id="spacing" type="range" min="-8" max="12" value="-4" step="1"></div><div class="control"><label class="label-row" for="font">字体风格</label><select id="font"><option value="sans">无衬线 Sans</option><option value="serif">衬线 Serif</option><option value="mono">等宽 Mono</option></select></div><button class="reset" id="reset" type="button">恢复初始排版</button></form></div>
      <p class="status" id="status" role="status" aria-live="polite">用 / 换行。支持中文、英文和你的下一句想法。</p>
    </main>
    <footer><span>type lab. / 交互排版实验</span><span>字重表现随系统安装的字体而变化。</span></footer>
  </div>
  <script>
    const display = document.getElementById('display');
    const form = document.getElementById('controls');
    const sizeInput = document.getElementById('size');
    const weightInput = document.getElementById('weight');
    const spacingInput = document.getElementById('spacing');
    const textInput = document.getElementById('text');
    const fontInput = document.getElementById('font');
    const families = { sans: 'Arial, "PingFang SC", "Microsoft YaHei", sans-serif', serif: 'Georgia, "Songti SC", "SimSun", serif', mono: 'Consolas, "Courier New", monospace' };
    function update() {
      display.textContent = textInput.value.split('/').map(line => line.trim()).join('\n');
      display.style.fontSize = `${sizeInput.value}px`;
      display.style.fontWeight = weightInput.value;
      display.style.letterSpacing = `${spacingInput.value}px`;
      display.style.fontFamily = families[fontInput.value];
      document.getElementById('size-output').textContent = `${sizeInput.value} px`;
      document.getElementById('weight-output').textContent = weightInput.value;
      document.getElementById('spacing-output').textContent = `${spacingInput.value} px`;
      document.getElementById('css-info').textContent = `font-size: ${sizeInput.value}px; font-weight: ${weightInput.value};`;
    }
    form.addEventListener('submit', event => event.preventDefault());
    form.addEventListener('input', update);
    form.addEventListener('change', update);
    document.getElementById('reset').addEventListener('click', () => {
      form.reset();
      if (window.innerWidth <= 800) sizeInput.value = '78';
      else if (document.documentElement.classList.contains('preview')) sizeInput.value = '108';
      update();
      document.getElementById('status').textContent = '已恢复初始排版。用 / 换行，再试一句文字。';
    });
    if (window.innerWidth <= 800) sizeInput.value = '78';
    else if (document.documentElement.classList.contains('preview')) sizeInput.value = '108';
    update();
  </script>
</body>
</html>
