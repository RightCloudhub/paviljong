<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="由 Canvas 粒子组成的轨道实验，移动指针改变视角，可以暂停或重新排列。">
  <meta name="theme-color" content="#141713">
  <title>Orbit — 粒子轨道实验</title>
  <script>if(new URLSearchParams(location.search).get('preview')==='1')document.documentElement.classList.add('preview');if(window.self!==window.top)document.documentElement.classList.add('embedded');</script>
  <style>
    .embedded .back { display: none; }
    :root{color-scheme:dark;--paper:#141713;--ink:#efeee2;--muted:#a3a99c;--accent:#dc945b;--line:#373d31}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}.page{max-width:1440px;margin:auto;padding:0 64px}header{height:96px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;display:flex;align-items:center;gap:11px;letter-spacing:-1px}.logo-mark{height:18px;width:18px;border:1px solid var(--accent);border-radius:50%;position:relative}.logo-mark:before{content:"";position:absolute;inset:3px;border:1px solid var(--accent);border-radius:50%;transform:rotate(45deg) scaleX(.6)}.back{min-height:44px;display:flex;align-items:center;font-size:12px;color:var(--muted)}.stage{position:relative;min-height:640px;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.intro{position:relative;z-index:1;padding-top:72px;pointer-events:none;max-width:460px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 0 33px}h1{font-family:Georgia,serif;font-size:clamp(58px,6.4vw,92px);font-weight:400;letter-spacing:-3.5px;line-height:1.07;margin:0;color:var(--ink)}h1 em{color:var(--accent);font-weight:400}.description{font-size:13px;line-height:1.9;color:var(--muted);max-width:225px;margin:31px 0 0}.stage-label{position:absolute;right:0;bottom:32px;font-size:10px;color:var(--muted);letter-spacing:2px}.controls{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:22px 0;gap:24px}.button-group{display:flex;gap:10px;align-items:center}.control{height:44px;border:1px solid #626b57;background:transparent;border-radius:100px;padding:0 24px;color:var(--ink);font-size:12px;transition:transform .2s,background .2s}.control.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.control:hover{background:#373d31;transform:translateY(-2px)}.control.primary:hover{background:#d9ddce}.control:active{transform:translateY(1px)}.status{font-size:11px;line-height:1.7;color:var(--muted);margin:0;text-align:right;max-width:330px}.canvas-error{position:absolute;inset:30% 5% 20% 50%;font-size:14px;line-height:1.8;color:var(--accent);display:flex;align-items:center}.canvas-error[hidden]{display:none}footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:24px 0 35px;font-size:11px;color:var(--muted)}
    @media(max-width:800px){.page{padding:0 24px}header{height:76px}.stage{min-height:650px}.intro{padding-top:40px;max-width:340px}.eyebrow{font-size:10px;margin-bottom:24px}h1{font-size:63px;letter-spacing:-2px}.description{font-size:12px;margin-top:22px;max-width:240px}.stage-label{font-size:9px;bottom:20px;right:0}.controls{flex-direction:column;align-items:stretch;gap:18px;padding:20px 0}.button-group{justify-content:center}.control{flex:1;padding:0 14px;max-width:200px}.status{text-align:center;max-width:none;font-size:11px}.canvas-error{inset:52% 16px 12%}.canvas-error p{margin:0}footer{gap:20px;line-height:1.7}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
    .preview .back,.preview footer,.preview .controls{display:none}.preview header{height:72px}.preview .stage{min-height:670px}.preview .intro{padding-top:80px}.preview h1{font-size:84px}
  </style>
</head>
<body>
  <div class="page">
    <header><a class="logo" href="../../index.html" aria-label="Orbit，返回作品集"><span class="logo-mark" aria-hidden="true"></span>orbit.</a><a class="back" href="../../index.html">返回作品集 ↗</a></header>
    <main>
      <section class="stage" id="stage" aria-labelledby="title"><canvas id="canvas" role="img" aria-label="橙色粒子沿多个椭圆轨道缓慢移动；可使用下方按钮暂停或重新排列">你的浏览器不支持 Canvas。请尝试使用现代浏览器。</canvas><div class="intro"><p class="eyebrow">AN EXPERIMENT IN MOTION</p><h1 id="title">Small moves.<br><em>New orbits.</em></h1><p class="description">一些粒子，一点引力。<br>移动指针，改变轨道的视角。</p></div><div class="canvas-error" id="canvas-error" hidden><p>浏览器暂时无法绘制 Canvas。你可以返回作品集，查看其他实验。</p></div><span class="stage-label" aria-hidden="true">PARTICLES / SPACE / MOTION</span></section>
      <div class="controls"><div class="button-group"><button class="control primary" id="toggle" type="button" aria-pressed="true">暂停动画</button><button class="control" id="shuffle" type="button">重新排列</button></div><p class="status" id="status" role="status" aria-live="polite">移动指针可改变视角，离开后回到原来的轨道。</p></div>
    </main>
    <footer><span>orbit. / Canvas 交互实验</span><span>由粒子与轨道组成的一小片空间。</span></footer>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const stage = document.getElementById('stage');
    const toggle = document.getElementById('toggle');
    const shuffle = document.getElementById('shuffle');
    const status = document.getElementById('status');
    const context = canvas.getContext('2d');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const isPreview = document.documentElement.classList.contains('preview');
    let running = !motionPreference.matches && !isPreview;
    let frame = null;
    let width = 0;
    let height = 0;
    let phase = .8;
    let previousTime = 0;
    let targetX = 0;
    let targetY = 0;
    let rotationX = 0;
    let rotationY = 0;
    let seed = 0;
    const rings = Array.from({length:12}, (_, index) => ({tilt: index * .155 + .2, radius: .78 + index * .019, count: 145 + index * 4}));
    function render() {
      if (!context) return;
      context.clearRect(0, 0, width, height);
      const mobile = width < 750;
      const centerX = mobile ? width * .5 : width * .69;
      const centerY = mobile ? height * .74 : height * .5;
      const radius = mobile ? Math.min(width * .42, height * .24) : Math.min(width * .275, height * .39);
      const particles = [];
      for (const [ringIndex, ring] of rings.entries()) {
        const tilt = ring.tilt + rotationX * .22 + seed;
        for (let point = 0; point < ring.count; point++) {
          const angle = point / ring.count * Math.PI * 2 + phase * (.22 + ringIndex * .014);
          const wave = Math.sin(angle * 3 + ringIndex * .6 + phase) * radius * .012;
          const x = Math.cos(angle) * radius * ring.radius;
          const y = Math.sin(angle) * radius * ring.radius;
          const z = y * Math.sin(tilt);
          const flatY = y * Math.cos(tilt);
          const turnedX = x * Math.cos(.42 + rotationY * .14) - flatY * Math.sin(.42 + rotationY * .14);
          const turnedY = x * Math.sin(.42 + rotationY * .14) + flatY * Math.cos(.42 + rotationY * .14);
          particles.push({x:centerX + turnedX + wave, y:centerY + turnedY + wave, z, size: .75 + (z / radius + 1) * .4, opacity:.19 + (z / radius + 1) * .27});
        }
      }
      particles.sort((a,b) => a.z - b.z);
      for (const particle of particles) {
        context.fillStyle = `rgba(232, 153, 93, ${particle.opacity})`;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        context.fill();
      }
      context.fillStyle = '#edb387';
      context.beginPath();
      context.arc(centerX, centerY, 4, 0, Math.PI * 2);
      context.fill();
    }
    function animate(time) {
      frame = null;
      if (!running || document.hidden || !context) return;
      if (previousTime) phase += Math.min(time - previousTime, 50) * .00015;
      previousTime = time;
      rotationX += (targetX - rotationX) * .06;
      rotationY += (targetY - rotationY) * .06;
      render();
      frame = requestAnimationFrame(animate);
    }
    function syncAnimation() {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      previousTime = 0;
      toggle.textContent = running ? '暂停动画' : '播放动画';
      toggle.setAttribute('aria-pressed', String(running));
      render();
      if (running && !document.hidden && context) frame = requestAnimationFrame(animate);
    }
    function resize() {
      const bounds = stage.getBoundingClientRect();
      width = bounds.width; height = bounds.height;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      if (context) context.setTransform(ratio, 0, 0, ratio, 0, 0);
      render();
    }
    stage.addEventListener('pointermove', event => {
      if (isPreview) return;
      const bounds = stage.getBoundingClientRect();
      targetX = (event.clientY - bounds.top) / bounds.height - .5;
      targetY = (event.clientX - bounds.left) / bounds.width - .5;
      if (!running) {rotationX = targetX; rotationY = targetY; render();}
    });
    stage.addEventListener('pointerleave', () => {
      targetX = 0; targetY = 0;
      if (!running) {rotationX = 0; rotationY = 0; render();}
    });
    toggle.addEventListener('click', () => {
      running = !running;
      status.textContent = running ? '动画已播放。移动指针可改变视角。' : '动画已暂停。仍可移动指针查看不同视角。';
      syncAnimation();
    });
    shuffle.addEventListener('click', () => {
      seed = Math.random() * .8;
      phase = Math.random() * Math.PI * 2;
      render();
      status.textContent = '已重新排列轨道。';
    });
    motionPreference.addEventListener('change', event => {
      if (event.matches) {running = false; syncAnimation(); status.textContent = '根据减少动态效果的设置，动画已暂停。';}
    });
    document.addEventListener('visibilitychange', syncAnimation);
    window.addEventListener('resize', resize);
    if (!context) {
      document.getElementById('canvas-error').hidden = false;
      toggle.disabled = true; shuffle.disabled = true;
      status.textContent = '此浏览器无法绘制 Canvas。';
    }
    resize();
    syncAnimation();
    if (motionPreference.matches && !isPreview) status.textContent = '根据减少动态效果的设置，动画默认暂停。需要时可以播放。';
  </script>
</body>
</html>
