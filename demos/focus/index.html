<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个简单的番茄钟，支持专注、休息、暂停和重置。">
  <meta name="theme-color" content="#f4f1ea">
  <title>Focus — 专注计时器</title>
  <script>if(new URLSearchParams(location.search).get('preview')==='1')document.documentElement.classList.add('preview');if(window.self!==window.top)document.documentElement.classList.add('embedded');</script>
  <style>
    .embedded .back { display: none; }
    :root{color-scheme:light;--paper:#f4f1ea;--ink:#393c31;--muted:#716f62;--line:#dcd9ce;--green:#82917c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px}button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:5px}.page{max-width:1440px;margin:auto;padding:0 64px}header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{display:flex;align-items:center;gap:11px;font-size:22px;letter-spacing:-1px}.logo-mark{height:18px;width:18px;border:2px solid var(--green);border-radius:50%;position:relative}.logo-mark:after{content:"";position:absolute;left:7px;top:3px;width:2px;height:6px;background:var(--green);transform-origin:bottom;transform:rotate(25deg)}.back{min-height:44px;display:flex;align-items:center;font-size:12px}.workspace{min-height:630px;display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 0 26px}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-4px;font-size:clamp(58px,6.1vw,87px);line-height:1.03;margin:0 0 32px}h1 em{font-weight:400;color:#737f66}.intro>p:last-child{font-size:14px;line-height:1.9;color:var(--muted);max-width:270px}.timer-workspace{display:flex;flex-direction:column;align-items:center;padding:34px 0 40px}.modes{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:100px;background:#e9e8de}.mode{height:40px;border:0;background:transparent;border-radius:100px;color:#615f53;padding:0 24px;font-size:12px;transition:background .2s,transform .2s}.mode[aria-pressed="true"]{background:#fcfaf5;color:var(--ink);box-shadow:0 1px 3px #393c310d}.mode:hover{background:#fcfaf5}.mode:active{transform:translateY(1px)}.clock{position:relative;width:min(100%,390px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin:30px 0 18px}.clock svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.clock circle{fill:none;stroke-width:1.5}.clock-track{stroke:#d8d8ca}.clock-progress{stroke:var(--green);stroke-linecap:round;stroke-dasharray:1131;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}.clock-text{text-align:center}.time{font-size:76px;font-weight:400;line-height:1;letter-spacing:-4px;font-variant-numeric:tabular-nums;display:block}.clock-note{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin:18px 0 0}.timer-actions{display:flex;gap:12px;justify-content:center}.start,.reset{height:46px;border-radius:100px;font-size:13px;transition:transform .2s,background .2s}.start{background:var(--ink);color:#fbf9f1;border:1px solid var(--ink);padding:0 34px;min-width:155px}.reset{border:1px solid var(--line);background:transparent;color:var(--ink);padding:0 22px}.start:hover{background:#535947;transform:translateY(-2px)}.reset:hover{background:#e9e8de;transform:translateY(-2px)}.start:active,.reset:active{transform:translateY(1px)}.status{min-height:22px;font-size:12px;text-align:center;color:var(--muted);margin:24px 0 0;line-height:1.7}footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:26px 0 34px;font-size:11px;color:var(--muted)}
    @media(max-width:800px){.page{padding:0 24px}header{height:76px}.workspace{grid-template-columns:1fr;gap:0;min-height:0}.intro{padding:42px 0 10px}.eyebrow{margin-bottom:20px}h1{font-size:65px;letter-spacing:-3px;margin-bottom:20px}.intro>p:last-child{font-size:13px;max-width:none}.timer-workspace{padding:24px 0 40px}.clock{width:min(100%,310px);margin:24px 0 18px}.time{font-size:65px}.mode{padding:0 22px}.status{font-size:12px;max-width:290px}footer{font-size:11px;gap:20px;line-height:1.7}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
    .preview .back,.preview footer{display:none}.preview header{height:72px}.preview .workspace{min-height:650px;gap:36px}.preview h1{font-size:76px}.preview .clock{width:350px}.preview .timer-workspace{padding:28px 0}.preview .status{margin-top:20px}
  </style>
</head>
<body>
  <div class="page">
    <header><a class="logo" href="../../index.html" aria-label="Focus，返回作品集"><span class="logo-mark" aria-hidden="true"></span>focus.</a><a class="back" href="../../index.html">返回作品集 ↗</a></header>
    <main class="workspace">
      <section class="intro" aria-labelledby="title"><p class="eyebrow">A LITTLE TIME, WELL SPENT</p><h1 id="title">One thing<br><em>at a time.</em></h1><p>留一点时间，给一件事。<br>25 分钟专注，5 分钟休息。</p></section>
      <section class="timer-workspace" aria-label="专注计时器"><div class="modes" aria-label="计时模式"><button class="mode" type="button" data-minutes="25" aria-pressed="true">专注 25 分钟</button><button class="mode" type="button" data-minutes="5" aria-pressed="false">休息 5 分钟</button></div><div class="clock"><svg viewBox="0 0 390 390" aria-hidden="true"><circle class="clock-track" cx="195" cy="195" r="180"></circle><circle class="clock-progress" id="progress" cx="195" cy="195" r="180"></circle></svg><div class="clock-text"><output class="time" id="time" role="timer" aria-live="off" aria-label="剩余时间">25:00</output><p class="clock-note" id="clock-note">专注于眼前这一件事</p></div></div><div class="timer-actions"><button class="start" id="start" type="button">开始专注</button><button class="reset" id="reset" type="button">重置计时</button></div><p class="status" id="status" role="status" aria-live="polite">准备好后，开始这一段时间。</p></section>
    </main>
    <footer><span>focus. / 番茄钟</span><span>专注一段时间，再休息一下。</span></footer>
  </div>
  <script>
    const timeOutput = document.getElementById('time');
    const progress = document.getElementById('progress');
    const startButton = document.getElementById('start');
    const status = document.getElementById('status');
    const note = document.getElementById('clock-note');
    const modes = [...document.querySelectorAll('.mode')];
    let totalMilliseconds = 25 * 60 * 1000;
    let remainingMilliseconds = totalMilliseconds;
    let deadline = 0;
    let interval = null;
    let isBreak = false;
    const modeName = () => isBreak ? '休息' : '专注';
    function render() {
      const seconds = Math.ceil(remainingMilliseconds / 1000);
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      timeOutput.textContent = `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
      progress.style.strokeDashoffset = String(1131 * (1 - remainingMilliseconds / totalMilliseconds));
      document.title = `${timeOutput.textContent} — ${modeName()} / Focus`;
    }
    function stop() {
      if (interval !== null) clearInterval(interval);
      interval = null;
    }
    function tick() {
      remainingMilliseconds = Math.max(0, deadline - Date.now());
      render();
      if (remainingMilliseconds === 0) {
        stop();
        startButton.textContent = `再来一段${modeName()}`;
        status.textContent = isBreak ? '休息结束。准备好后，开始下一段专注。' : '这一段专注完成了。切换到休息，活动一下。';
      }
    }
    function reset(announce = true) {
      stop();
      remainingMilliseconds = totalMilliseconds;
      startButton.textContent = `开始${modeName()}`;
      note.textContent = isBreak ? '给思绪留一小段空白' : '专注于眼前这一件事';
      if (announce) status.textContent = `已重置为 ${totalMilliseconds / 60000} 分钟${modeName()}。`;
      render();
    }
    startButton.addEventListener('click', () => {
      if (interval !== null) {
        remainingMilliseconds = Math.max(0, deadline - Date.now());
        stop();
        render();
        startButton.textContent = `继续${modeName()}`;
        status.textContent = '计时已暂停。准备好后可以继续。';
      } else {
        if (remainingMilliseconds <= 0) remainingMilliseconds = totalMilliseconds;
        deadline = Date.now() + remainingMilliseconds;
        interval = setInterval(tick, 250);
        startButton.textContent = '暂停计时';
        status.textContent = isBreak ? '休息计时中。放下屏幕，看看远处。' : '专注计时中。现在只做眼前这一件事。';
        tick();
      }
    });
    document.getElementById('reset').addEventListener('click', () => reset());
    modes.forEach(mode => mode.addEventListener('click', () => {
      if (mode.getAttribute('aria-pressed') === 'true') return;
      modes.forEach(button => button.setAttribute('aria-pressed', String(button === mode)));
      isBreak = mode.dataset.minutes === '5';
      totalMilliseconds = Number(mode.dataset.minutes) * 60 * 1000;
      reset();
    }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden && interval !== null) tick(); });
  </script>
</body>
</html>
