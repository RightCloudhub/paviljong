name: Add project from contributor issue

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

# Edits to one issue supersede earlier pending runs. Different issues do not
# share a queue; the importer resolves concurrent branch updates atomically.
concurrency:
  group: issue-project-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  import:
    name: Validate contributor and import project
    if: startsWith(github.event.issue.title, '[作品提交]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    outputs:
      publish: ${{ steps.import.outputs.publish }}
      branch: ${{ steps.import.outputs.branch }}
      commit_sha: ${{ steps.import.outputs.commit_sha }}
    steps:
      - name: Check out trusted repository scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Import issue data
        id: import
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const moduleURL = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/issue-import.mjs'));
            const { runIssueImport } = await import(moduleURL.href);
            await runIssueImport({ github, context, core });

  publish:
    name: Publish updated portfolio
    needs: import
    if: needs.import.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.import.outputs.branch }}
